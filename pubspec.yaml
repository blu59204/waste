name: waste_wise
description: A Flutter project for the Waste Wise app with a clay 3D theme.

publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  clay_containers: ^1.0.0 # For clay 3D theme
  provider: ^6.0.0 # State management
  # Add other dependencies as needed

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
